name: sync-to-server

# 本地 push 到 GitHub 后：用自托管 runner 把源码打包推给内网服务器部署
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: [self-hosted, astro]
    steps:
      - uses: actions/checkout@v4

      - name: package source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.astro \
              -czf /tmp/astro-src.tgz .

      - name: push to server
        run: |
          curl -fsS -X POST \
            -H 'Content-Type: application/gzip' \
            --data-binary @/tmp/astro-src.tgz \
            "http://192.168.8.50:9001/sync/31bce28b62eeae25b1ba00723227949f/astro"
